<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Academy | Yönetim Paneli</title>
    <style>
        :root { --bg: #020617; --card: #1e293b; --primary: #38bdf8; --danger: #ef4444; --text: #f8fafc; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px;
        }
        .admin-container { max-width: 1000px; margin: 0 auto; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid rgba(56, 189, 248, 0.2); }
        .stat-card h3 { margin: 0; font-size: 0.9rem; color: var(--primary); text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 2rem; font-weight: bold; }

        .user-table-container { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.2); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(56, 189, 248, 0.1); padding: 15px; color: var(--primary); }
        td { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        tr:hover { background: rgba(255, 255, 255, 0.02); }

        .btn { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-delete { background: var(--danger); color: white; }
        .btn-delete:hover { background: white; color: var(--danger); }
        .btn-logout { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-logout:hover { background: var(--danger); color: white; }

        .empty-msg { padding: 40px; text-align: center; opacity: 0.5; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header">
        <h1>Yönetici Paneli</h1>
        <button class="btn btn-logout" onclick="logout()">Güvenli Çıkış</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Toplam Kayıtlı Öğrenci</h3>
            <p id="totalUsers">0</p>
        </div>
        <div class="stat-card">
            <h3>Sistem Durumu</h3>
            <p style="color: #22c55e; font-size: 1.2rem;">AKTİF</p>
        </div>
    </div>

    <div class="user-table-container">
        <table>
            <thead>
                <tr>
                    <th>Kullanıcı Adı</th>
                    <th>E-Posta</th>
                    <th>Şifre (Admin Görünümü)</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="userList">
                </tbody>
        </table>
        <div id="emptyMsg" class="empty-msg" style="display: none;">Henüz hiç kayıtlı öğrenci yok.</div>
    </div>
</div>

<script>
    // GÜVENLİK KONTROLÜ: Sadece admin girebilir
    const activeUser = JSON.parse(sessionStorage.getItem('activeUser'));
    if (!activeUser || activeUser.username !== "admin") {
        alert("Bu sayfaya sadece yönetici erişebilir!");
        window.location.href = 'index.html';
    }

    function loadData() {
        const userList = document.getElementById('userList');
        const totalUsers = document.getElementById('totalUsers');
        const emptyMsg = document.getElementById('emptyMsg');
        
        userList.innerHTML = "";
        let count = 0;

        // LocalStorage'ı tara
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            
            // Sadece kullanıcı verilerini al (admin hariç)
            if (key.startsWith('academy_user_')) {
                count++;
                const user = JSON.parse(localStorage.getItem(key));
                
                const row = `
                    <tr>
                        <td><strong>${user.username}</strong></td>
                        <td>${user.email}</td>
                        <td><code style="background:#000; padding:2px 5px; border-radius:4px;">${user.password}</code></td>
                        <td>
                            <button class="btn btn-delete" onclick="deleteUser('${key}')">Sil</button>
                        </td>
                    </tr>
                `;
                userList.innerHTML += row;
            }
        }

        totalUsers.innerText = count;
        emptyMsg.style.display = count === 0 ? "block" : "none";
    }

    function deleteUser(key) {
        if (confirm("Bu öğrenciyi sistemden silmek istediğine emin misin?")) {
            localStorage.removeItem(key);
            loadData(); // Listeyi yenile
        }
    }

    function logout() {
        sessionStorage.removeItem('activeUser');
        window.location.href = 'index.html';
    }

    // Sayfa açıldığında verileri yükle
    loadData();
</script>

</body>
</html>
