<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Academy | Giriş</title>
    <style>
        :root {
            --primary: #38bdf8;
            --purple: #a855f7;
            --bg: #020617;
            --glass: rgba(15, 23, 42, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e1b4b, #020617);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Arka Plan Hareketli Işıklar */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.2;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50px, -50px); }
            to { transform: translate(50px, 50px); }
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        h2 { margin-bottom: 10px; letter-spacing: 1px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--primary); }
        
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-primary { background: var(--primary); color: #020617; }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }

        .switch {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .switch span { color: var(--primary); cursor: pointer; font-weight: bold; }

        .msg { margin-top: 15px; font-size: 0.85rem; min-height: 1.2rem; }
    </style>
</head>
<body>

    <div class="blob"></div>

    <div class="login-card">
        <img src="img.png" alt="Logo" class="logo">
        
        <div id="form-container">
            <h2 id="title">Giriş Yap</h2>
            <p id="desc">Software Academy dünyasına dön.</p>

            <div class="input-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="Kullanıcı adını gir...">
            </div>

            <div class="input-group">
                <label>Şifre</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="btn btn-primary" onclick="handleAuth()" id="mainBtn">Giriş Yap</button>
            
            <div class="msg" id="msg"></div>

            <div class="switch" id="switch-text">
                Hesabın yok mu? <span onclick="toggleMode()">Kayıt Ol</span>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            const title = document.getElementById('title');
            const desc = document.getElementById('desc');
            const mainBtn = document.getElementById('mainBtn');
            const switchText = document.getElementById('switch-text');

            if (isLogin) {
                title.innerText = "Giriş Yap";
                desc.innerText = "Software Academy dünyasına dön.";
                mainBtn.innerText = "Giriş Yap";
                switchText.innerHTML = 'Hesabın yok mu? <span onclick="toggleMode()">Kayıt Ol</span>';
            } else {
                title.innerText = "Kayıt Ol";
                desc.innerText = "Yeni bir hesap oluştur ve başla.";
                mainBtn.innerText = "Kayıt Ol";
                switchText.innerHTML = 'Zaten hesabın var mı? <span onclick="toggleMode()">Giriş Yap</span>';
            }
        }

        function handleAuth() {
            const userInp = document.getElementById('username').value;
            const passInp = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            if (!userInp || !passInp) {
                msg.style.color = "#ef4444";
                msg.innerText = "Lütfen alanları doldur!";
                return;
            }

            // GİZLİ KAPI: 5e / 5e kontrolü
            if (userInp === "SEYMA-HOCA" && passInp === "SEYMA-HOCA") {
                sessionStorage.setItem('activeUser', JSON.stringify({username: "ŞEYMA HOCAM WELCOME TU TAKSİM MEYDAN"}));
                window.location.href = 'software-academy.html';
                return;
            }

            let users = JSON.parse(localStorage.getItem('sa_users')) || [];

            if (isLogin) {
                // Giriş Mantığı
                const foundUser = users.find(u => u.username === userInp && u.password === passInp);
                if (foundUser) {
                    sessionStorage.setItem('activeUser', JSON.stringify(foundUser));
                    window.location.href = 'software-academy.html';
                } else {
                    msg.style.color = "#ef4444";
                    msg.innerText = "Hatalı kullanıcı adı veya şifre!";
                }
            } else {
                // Kayıt Mantığı
                const exists = users.find(u => u.username === userInp);
                if (exists) {
                    msg.style.color = "#ef4444";
                    msg.innerText = "Bu kullanıcı adı zaten alınmış!";
                } else {
                    users.push({ username: userInp, password: passInp });
                    localStorage.setItem('sa_users', JSON.stringify(users));
                    msg.style.color = "#10b981";
                    msg.innerText = "Başarıyla kayıt oldun! Giriş yapabilirsin.";
                    setTimeout(toggleMode, 1500);
                }
            }
        }
    </script>
</body>
</html>
