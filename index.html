<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Academy | Giriş Portalı</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --bg: #020617; --card: #1e293b; --primary: #38bdf8; --text: #f8fafc; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; 
            margin: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%);
        }
        .auth-card { 
            background: rgba(30, 41, 59, 0.7); padding: 3rem; border-radius: 40px; 
            border: 2px solid var(--primary); backdrop-filter: blur(25px); 
            width: 100%; max-width: 400px; text-align: center;
        }
        .input-box { margin-bottom: 20px; text-align: left; }
        .input-box label { display: block; margin-bottom: 6px; color: var(--primary); font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        input { 
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.2); 
            background: rgba(15, 23, 42, 0.8); color: white; outline: none; box-sizing: border-box; 
        }
        .btn-glow { 
            width: 100%; background: var(--primary); color: #020617; border: none; 
            padding: 16px; border-radius: 12px; font-weight: 900; cursor: pointer; 
            text-transform: uppercase; margin-top: 10px; transition: 0.3s;
        }
        .btn-glow:hover { background: white; transform: translateY(-2px); }
        .footer-link { margin-top: 20px; color: #818cf8; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1 id="mainTitle">Kayıt Ol</h1>
        <p id="subTitle" style="opacity:0.6; margin-bottom:20px;">Akademiye hoş geldin!</p>

        <div class="input-box" id="emailSection">
            <label>E-Posta</label>
            <input type="email" id="emailField" placeholder="mail@adres.com">
        </div>

        <div class="input-box">
            <label>Kullanıcı Adı</label>
            <input type="text" id="userField" placeholder="Kullanıcı adın">
        </div>

        <div class="input-box">
            <label>Şifre</label>
            <input type="password" id="passField" placeholder="••••••••">
        </div>

        <button class="btn-glow" id="actionBtn" onclick="handleAuth()">Hesabı Oluştur</button>
        <div class="footer-link" id="toggleLink" onclick="toggleMode()">Zaten hesabın var mı? Giriş Yap</div>
    </div>

<script>
    (function() { emailjs.init("ZQTATClFkWWdzYdJn"); })();

    let loginMode = false;

    function toggleMode() {
        loginMode = !loginMode;
        document.getElementById('mainTitle').innerText = loginMode ? "Giriş Yap" : "Kayıt Ol";
        document.getElementById('actionBtn').innerText = loginMode ? "Giriş Yap" : "Hesabı Oluştur";
        document.getElementById('toggleLink').innerText = loginMode ? "Hesabın yok mu? Kayıt Ol" : "Zaten hesabın var mı? Giriş Yap";
        document.getElementById('emailSection').style.display = loginMode ? "none" : "block";
    }

    function handleAuth() {
        const user = document.getElementById('userField').value.trim();
        const pass = document.getElementById('passField').value.trim();
        const email = document.getElementById('emailField').value.trim();

        if (!user || !pass || (!loginMode && !email)) {
            alert("Boş alan bırakma!");
            return;
        }

        if (loginMode) {
            // --- GİRİŞ KONTROLÜ ---
            
            // 1. ÖNCE ADMİN KONTROLÜ (Kayıt gerektirmez)
            if (user === "admin" && pass === "123456789") {
                const adminData = { username: "admin", role: "admin" };
                sessionStorage.setItem('activeUser', JSON.stringify(adminData));
                window.location.href = 'admin.html'; // Admin direkt panele
                return;
            }

            // 2. NORMAL KULLANICI KONTROLÜ
            const saved = localStorage.getItem('academy_user_' + user);
            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed.password === pass) {
                    sessionStorage.setItem('activeUser', JSON.stringify(parsed));
                    window.location.href = 'politika.html'; // Kullanıcı önce politikaya
                } else { alert("Şifre yanlış!"); }
            } else { alert("Kullanıcı bulunamadı!"); }

        } else {
            // --- KAYIT KONTROLÜ ---
            if (localStorage.getItem('academy_user_' + user)) {
                alert("Bu isim zaten alınmış!");
                return;
            }

            // EmailJS ile bildirim gönder (Opsiyonel)
            emailjs.send('Software Academy', 'BURAYA_TEMPLATE_ID_YAZ', {
                username: user,
                user_email: email
            });

            // Kaydet
            const newUser = { username: user, password: pass, email: email, level: 1 };
            localStorage.setItem('academy_user_' + user, JSON.stringify(newUser));
            alert("Kayıt başarılı! Şimdi giriş yapabilirsin.");
            location.reload();
        }
    }
</script>
</body>
</html>
