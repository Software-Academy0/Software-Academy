<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proje Atölyesi | HTML3</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --primary: #38bdf8; --accent: #818cf8; --success: #10b981; --text: #f8fafc; }
        
        body { 
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; 
            margin: 0; padding-bottom: 100px;
        }

        .header { 
            background: rgba(15, 23, 42, 0.9); padding: 25px; text-align: center;
            border-bottom: 2px solid var(--primary); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
        }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }

        /* --- PROJE KARTLARI --- */
        .project-card { 
            background: var(--card); border-radius: 30px; padding: 35px; margin-bottom: 40px;
            border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .tag-badge { 
            background: var(--primary); color: #000; padding: 5px 15px; 
            border-radius: 50px; font-weight: 800; font-size: 0.8rem; margin-bottom: 15px; display: inline-block;
        }

        h2 { color: var(--primary); font-size: 2rem; margin: 10px 0; }
        .usage-info { color: #94a3b8; font-size: 1.1rem; margin-bottom: 25px; line-height: 1.6; }

        /* --- KOD ALANI --- */
        .code-block { 
            background: #000; border-radius: 20px; padding: 25px; position: relative;
            border-left: 5px solid var(--success); overflow-x: auto;
        }
        pre { margin: 0; color: var(--success); font-family: 'Fira Code', monospace; font-size: 1rem; }
        
        .copy-btn {
            position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1);
            border: none; color: white; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.7rem;
        }

        /* --- NAVİGASYON --- */
        .nav-footer {
            position: fixed; bottom: 0; width: 100%; background: #0f172a; padding: 20px 0;
            display: flex; justify-content: center; gap: 20px; border-top: 1px solid var(--primary);
        }
        .btn-nav { 
            background: var(--primary); color: #000; border: none; padding: 12px 30px; 
            border-radius: 12px; font-weight: 900; cursor: pointer; text-decoration: none;
        }

        @media (max-width: 768px) {
            .project-card { padding: 20px; }
            h2 { font-size: 1.5rem; }
            pre { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 style="margin:0; font-size: 1.6rem; letter-spacing: 1px;">HTML UYGULAMA ATÖLYESİ</h1>
    </header>

    <div class="container">
        <div id="project-list">
            </div>
    </div>

    <div class="nav-footer">
        <a href="html2.html" class="btn-nav" style="background: #475569; color: white;">GERİ DÖN</a>
        <a href="software-academy.html" class="btn-nav">DASHBOARD</a>
    </div>

<script>
    const projects = [
        {
            tags: "form, input, label, button",
            title: "Modern Giriş Formu",
            desc: "Kullanıcılardan veri almak için kullanılan en temel yapıdır. Kayıt sayfaları ve iletişim formlarında kullanılır.",
            code: `<form action="/kaydet" method="POST">\n  <label for="email">E-posta Adresi:</label>\n  <input type="email" id="email" placeholder="ornek@mail.com">\n  \n  <label for="pass">Şifre:</label>\n  <input type="password" id="pass">\n  \n  <button type="submit">Giriş Yap</button>\n</form>`
        },
        {
            tags: "nav, ul, li, a",
            title: "Navigasyon Menüsü",
            desc: "Sitenin en üstünde yer alan, sayfalar arası geçişi sağlayan ana menü yapısıdır.",
            code: `<nav>\n  <ul>\n    <li><a href="#home">Ana Sayfa</a></li>\n    <li><a href="#about">Hakkımızda</a></li>\n    <li><a href="#services">Hizmetler</a></li>\n    <li><a href="#contact">İletişim</a></li>\n  </ul>\n</nav>`
        },
        {
            tags: "table, thead, tbody, tr, td",
            title: "Fiyat Tablosu",
            desc: "Ürün özelliklerini veya fiyat listelerini düzenli bir şekilde göstermek için kullanılır.",
            code: `<table>\n  <thead>\n    <tr><th>Paket</th><th>Fiyat</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Başlangıç</td><td>100 TL</td></tr>\n    <tr><td>Pro</td><td>250 TL</td></tr>\n  </tbody>\n</table>`
        },
        {
            tags: "video, audio, iframe",
            title: "Medya Oynatıcı Paneli",
            desc: "Sitenize YouTube videoları, yerel videolar veya müzik listeleri eklemek için kullanılır.",
            code: `\n<video width="320" height="240" controls>\n  <source src="film.mp4" type="video/mp4">\n</video>\n\n\n<iframe src="https://www.google.com/maps/embed" width="100%" height="300"></iframe>`
        },
        {
            tags: "header, section, article, footer",
            title: "Blog Sayfası Düzeni",
            desc: "Modern HTML5 semantik etiketleri kullanarak SEO uyumlu bir makale yapısı oluşturur.",
            code: `<header>\n  <h1>Yazılım Blogu</h1>\n</header>\n<section>\n  <article>\n    <h2>HTML Nedir?</h2>\n    <p>HTML bir işaretleme dilidir...</p>\n  </article>\n</section>\n<footer>\n  <p>© 2026 Salih Academy</p>\n</footer>`
        }
    ];

    const projectList = document.getElementById('project-list');
    
    projects.forEach(proj => {
        projectList.innerHTML += `
            <div class="project-card">
                <span class="tag-badge">ETİKETLER: ${proj.tags}</span>
                <h2>${proj.title}</h2>
                <p class="usage-info">${proj.desc}</p>
                <div class="code-block">
                    <button class="copy-btn" onclick="alert('Kod kopyalandı!')">KOPYALA</button>
                    <pre>${proj.code.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>
                </div>
            </div>
        `;
    });
</script>

</body>
</html>
