<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Software Academy | Kullanıcı Politikası</title>
    <style>
        :root { --bg: #020617; --primary: #38bdf8; --card: #1e293b; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .info-card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--primary); box-shadow: 0 0 30px rgba(56,189,248,0.1); }
        h2 { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .user-list { list-style: none; padding: 0; margin-top: 20px; }
        .user-item { background: rgba(255,255,255,0.05); padding: 10px 15px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; }
        .admin-badge { background: #ef4444; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .stats { font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="info-card">
        <h2 id="viewTitle">Kullanıcı Bilgileri</h2>
        <div id="adminStats" style="display: none;">
            <p class="stats">Toplam Kayıtlı Öğrenci: <span id="userCount">0</span></p>
        </div>
        
        <ul id="displayArea" class="user-list">
            </ul>

        <button onclick="logout()" style="margin-top:20px; padding:10px; cursor:pointer; background:none; border:1px solid #ef4444; color:#ef4444; border-radius:10px;">Çıkış Yap</button>
    </div>
</div>

<script>
    // Giriş yapan kullanıcıyı kontrol et
    const activeUser = JSON.parse(sessionStorage.getItem('activeUser'));

    if (!activeUser) {
        alert("Yetkisiz erişim! Giriş sayfasına yönlendiriliyorsunuz.");
        window.location.href = 'index.html';
    }

    const displayArea = document.getElementById('displayArea');
    const adminStats = document.getElementById('adminStats');
    const viewTitle = document.getElementById('viewTitle');

    // MANTIK BURADA ÇALIŞIYOR
    if (activeUser.username === "admin") {
        // --- EĞER ADMİN İSE HERKESİ GÖSTER ---
        viewTitle.innerText = "Yönetici Paneli - Tüm Kullanıcılar";
        adminStats.style.display = "block";
        
        let count = 0;
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('academy_user_')) {
                count++;
                const user = JSON.parse(localStorage.getItem(key));
                displayArea.innerHTML += `<li class="user-item">
                    <span>👤 ${user.username}</span>
                    <span>📧 ${user.email}</span>
                </li>`;
            }
        }
        document.getElementById('userCount').innerText = count;

    } else {
        // --- EĞER NORMAL KULLANICI İSE SADECE KENDİSİNİ GÖSTER ---
        viewTitle.innerText = "Profil Bilgilerim";
        displayArea.innerHTML = `<li class="user-item" style="border-left: 4px solid var(--primary);">
            <span><strong>İsim:</strong> ${activeUser.username}</span>
            <span><strong>E-Posta:</strong> ${activeUser.email}</span>
        </li>
        <p style="opacity:0.6; font-size:0.9rem; margin-top:15px;">
            * Güvenlik gereği diğer öğrencilerin isimlerini görme yetkiniz yoktur.
        </p>`;
    }

    function logout() {
        sessionStorage.removeItem('activeUser');
        window.location.href = 'software-academy.html';
    }
</script>

</body>
</html>
